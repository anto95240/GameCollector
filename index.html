    <script>
      (function() {
        // Mapping de compatibilité (doit rester synchronisé avec themeMigration.ts)
        var LEGACY_IDS = {
          'neon-night': 'neon_night',
          'arctic-day': 'arctic_day',
          'light': 'arctic_day',
          'andys_room': 'andy_s_room',
          'gusteaus': 'gusteau_s',
          'santagata': 'sant_agata',
          'ici_cest_paris': 'ici_c_est_paris'
        };
        try {
          var raw = localStorage.getItem('gc_equipped_theme');
          var theme = raw ? JSON.parse(raw) : 'neon_night';
          if (typeof theme === 'string') {
            theme = LEGACY_IDS[theme] || theme;
          } else {
            theme = 'neon_night';
          }
          document.documentElement.setAttribute('data-preset', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-preset', 'neon_night');
        }
      })();
    </script>
    <title>GameCollector</title>
